eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:9001/eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    lk.dilshan.hesara.eca: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG