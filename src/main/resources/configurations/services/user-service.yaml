spring:
  mvc:
    problemdetails:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:12500/d_pay_users
    username: postgres
    password: psql
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8000
  forward-headers-strategy: framework

gcp:
  storage:
    bucket-name: YOUR_GCS_BUCKET_NAME
    credentials-path: YOUR_GCS_CREDENTIALS_JSON_PATH


eureka:
  instance:
    prefer-ip-address: true
    hostname: localhost